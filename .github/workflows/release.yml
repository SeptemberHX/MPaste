# Builds the Windows zip and the Ubuntu .deb.
# - Pushing a version tag (0.8.1 or v0.8.1) builds both and publishes a GitHub
#   release with them, its notes taken from that version's CHANGELOG.md section.
# - Running it by hand (Actions → Release → Run workflow) only builds, and keeps
#   the packages as workflow artifacts: a dry run before tagging.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the version from CMakeLists.txt
        shell: bash
        run: |
          part() { sed -nE "s/^set\(_VERSION_$1 ([0-9]+)\)$/\1/p" CMakeLists.txt; }
          version="$(part MAJOR).$(part MINOR).$(part PATCH)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CMakeLists.txt version: $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($version)."
            exit 1
          fi

  windows:
    name: Windows (MinGW, Qt 6.11)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Qt 6.11.2 and MinGW 13.1 straight from download.qt.io, each archive
      # checked against the .sha1 published beside it and unpacked where the
      # repository's Updates.xml says. The same Qt as the .deb's (Ubuntu
      # 26.10's 6.11.2), so what builds on Linux builds here. Not through
      # install-qt-action: aqtinstall's last release (3.3.0) does not know the
      # repository layout Qt 6.11 moved to (qt6_6112/qt6_6112_mingw/), so
      # 0.8.7 and 0.8.8 had no Windows zip.
      - name: Install Qt and MinGW
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $repo = 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop'
          $root = 'C:\Qt'
          $prefix = "$root\6.11.2\mingw_64"
          $stamp = '6.11.2-0-202608131017'
          $suffix = 'Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z'
          $qt = "$repo/qt6_6112/qt6_6112_mingw/qt.qt6.6112.win64_mingw"
          $archives = @(
            @{ url = "$qt/${stamp}qtbase-$suffix"; to = $prefix },
            @{ url = "$qt/${stamp}qtsvg-$suffix"; to = $prefix },
            @{ url = "$qt/${stamp}qttools-$suffix"; to = $prefix },
            @{ url = "$qt/${stamp}qttranslations-$suffix"; to = $prefix },
            @{ url = "$qt/${stamp}MinGW-w64-x86_64-13.1.0-release-posix-seh-msvcrt-rt_v11-rev1-runtime.7z"; to = "$prefix\bin" },
            @{ url = "$qt/${stamp}d3dcompiler_47-x64.7z"; to = "$prefix\bin" },
            @{ url = "$qt/${stamp}opengl32sw-64-mesa_11_2_2-signed_sha256.7z"; to = "$prefix\bin" },
            @{ url = "$repo/tools_mingw1310/qt.tools.win64_mingw1310/13.1.0-202407240918mingw1310.7z"; to = $root }
          )
          $download = "$env:RUNNER_TEMP\qt-archives"
          New-Item -ItemType Directory -Force $download | Out-Null
          foreach ($a in $archives) {
            $file = Join-Path $download ([IO.Path]::GetFileName($a.url))
            Write-Host "Downloading $($a.url)"
            Invoke-WebRequest -Uri $a.url -OutFile $file -MaximumRetryCount 3 -RetryIntervalSec 5
            $expected = (Invoke-WebRequest -Uri "$($a.url).sha1" -MaximumRetryCount 3 -RetryIntervalSec 5).Content
            if ($expected -is [byte[]]) { $expected = [Text.Encoding]::ASCII.GetString($expected) }
            $expected = $expected.Trim().Split(' ')[0].ToLower()
            $actual = (Get-FileHash $file -Algorithm SHA1).Hash.ToLower()
            if ($actual -ne $expected) { throw "SHA-1 mismatch for $file`: $actual, expected $expected" }
            New-Item -ItemType Directory -Force $a.to | Out-Null
            7z x $file "-o$($a.to)" -y -bso0 -bsp0
            if ($LASTEXITCODE -ne 0) { throw "7z failed on $file" }
          }
          if (-not (Test-Path "$prefix\lib\cmake\Qt6\Qt6Config.cmake")) { throw "Qt was not unpacked into $prefix" }
          $gxx = Get-ChildItem $root -Recurse -Filter 'g++.exe' | Where-Object { $_.DirectoryName -like '*\Tools\mingw*\bin' } | Select-Object -First 1
          if (-not $gxx) { throw "MinGW was not unpacked under $root\Tools" }
          "QT_ROOT_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $gxx.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $gxx.FullName --version

      - name: Build and package
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release "-DMPASTE_QT_ROOT=$env:QT_ROOT_DIR"
          cmake --build build --target package --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: MPaste-${{ needs.version.outputs.version }}-win64
          path: build/MPaste-${{ needs.version.outputs.version }}-win64.zip
          if-no-files-found: error

  ubuntu:
    name: Ubuntu 26.10 (.deb)
    needs: version
    runs-on: ubuntu-latest
    # The package depends on the Qt of the release it is built on, and the GNOME
    # companion targets GNOME 51, so it is built in that release.
    container: ubuntu:26.10
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build pkg-config dpkg-dev file \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-wayland libx11-dev libxcb-keysyms1-dev libxdo-dev \
            libwayland-dev libwayland-bin wayland-protocols \
            libonnxruntime-dev

      - uses: actions/checkout@v4

      - name: Build and package
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          cd build && cpack -G DEB

      - name: Show the package
        run: |
          deb=build/mpaste_${{ needs.version.outputs.version }}_amd64.deb
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: mpaste_${{ needs.version.outputs.version }}_amd64
          path: build/mpaste_${{ needs.version.outputs.version }}_amd64.deb
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [version, windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version='${{ needs.version.outputs.version }}'
          # The lines under "## <version>", up to the next "## " heading.
          awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md has no '## $version' section; the release has no notes."
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: MPaste ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
